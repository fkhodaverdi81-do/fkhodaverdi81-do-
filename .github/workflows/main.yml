
name: Generate Pacman

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: fkhodaverdi81-do
          github_repo_name: rhythmMD
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pacman_color: "#00ff00"
          pacman_speed: 1
